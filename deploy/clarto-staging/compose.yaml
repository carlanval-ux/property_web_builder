# CLARTO Inmobiliaria — staging stack (Liberu backoffice + PWB public catalog).
# Everything that varies per host lives in .env (generated by scripts/init-env.sh,
# never committed). Image tags are pinned; app sources are pinned by git SHA
# (Liberu: versions.env; PWB: the commit of this repository that is checked out).

name: clarto-staging

x-liberu-env: &liberu-env
  APP_NAME: ${PANEL_BRAND:-CLARTO Gestión Inmobiliaria}
  APP_ENV: staging
  XDG_CONFIG_HOME: /tmp           # psysh (tinker) config dir writable by www-data
  APP_STAFF_ONLY: "true"          # every web URL requires a session (internal tool)
  IDENTITY_REGISTRATION: closed   # no public self-registration (web or API)
  APP_DEBUG: "false"
  APP_KEY: ${LIBERU_APP_KEY:?}
  APP_URL: https://${LIBERU_HOST:?}
  APP_LOCALE: es
  APP_LOCALES: es,en,tr
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: es_ES
  APP_CURRENCY: EUR
  PROPERTY_REFERENCE_PREFIX: ${PROPERTY_REFERENCE_PREFIX:-CL}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  # SQLite on the persistent storage volume (outside storage/app/public). This is
  # the engine upstream installs and tests with; a clean `migrate` on MySQL or
  # PostgreSQL fails (organizations-teams 2024_09_29_093707_add_team_to_resources
  # alters tables no migration creates). Journal mode WAL is set by the entrypoint.
  DB_CONNECTION: sqlite
  DB_DATABASE: /var/www/html/storage/app/db/panel.sqlite
  DB_FOREIGN_KEYS: "true"
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  REDIS_CACHE_DB: "3"
  REDIS_PREFIX: panel_
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: public
  # Test mailbox (Mailpit) unless scripts/set-smtp.sh configured a real mailbox in .env
  # Continuar con Google (cliente OAuth propio de CLARTO). Vacío = botón oculto y rutas OAuth cerradas.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: https://${LIBERU_HOST:?}/oauth/google/callback
  # GoHighLevel: oportunidad ganada → expediente (vacío = webhook cerrado)
  GHL_API_TOKEN: ${GHL_API_TOKEN:-}
  GHL_LOCATION_ID: ${GHL_LOCATION_ID:-}
  GHL_PIPELINE_ID: ${GHL_PIPELINE_ID:-}
  GHL_WEBHOOK_SECRET: ${GHL_WEBHOOK_SECRET:-}
  # Captación GHL (PR #18): etapa «Valoración entregada», fecha desde la que se sincroniza y enlaces de cita por oficina.
  GHL_PIPELINE_STAGE_ID: ${GHL_PIPELINE_STAGE_ID:-}
  GHL_STAGE_ENTREGADA: ${GHL_STAGE_ENTREGADA:-}
  GHL_ALTA_DESDE: ${GHL_ALTA_DESDE:-}
  VALORACIONES_CITA_VALENCIA: ${VALORACIONES_CITA_VALENCIA:-}
  VALORACIONES_CITA_SAGUNTO: ${VALORACIONES_CITA_SAGUNTO:-}
  VALORACIONES_CITA_BELLREGUARD: ${VALORACIONES_CITA_BELLREGUARD:-}
  # WhatsApp (WAHA, servicio interno «waha»): API con clave y webhooks firmados (HMAC SHA-512) hacia la URL interna.
  WAHA_URL: http://waha:3000
  WAHA_API_KEY: ${WAHA_API_KEY:?}
  WAHA_WEBHOOK_URL: http://liberu-app/api/v1/whatsapp/webhook
  WAHA_WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:?}
  WAHA_SESSION: ${WAHA_SESSION:-default}   # WAHA Core: una sola sesión, «default»
  # pisos.com (envíos reales desactivados por defecto)
  PISOS_ENABLED: ${PISOS_ENABLED:-false}
  PISOS_DRIVER: ${PISOS_DRIVER:-simulado}
  PISOS_API_KEY: ${PISOS_API_KEY:-}
  PISOS_USER_ID: ${PISOS_USER_ID:-}
  PISOS_CONTACTO_TELEFONO: ${PISOS_CONTACTO_TELEFONO:-}
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: "${MAIL_PORT:-1025}"
  MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@clarto.es}
  MAIL_FROM_NAME: ${PANEL_BRAND:-CLARTO Gestión Inmobiliaria}
  SEED_ADMIN_PASSWORD: ${LIBERU_ADMIN_PASSWORD:?}
  # Read-only catalog API for the website (clarto.es/inmuebles), server-to-server.
  CATALOGO_API_KEY: ${CATALOGO_API_KEY:?}
  CATALOGO_MODO_PRUEBAS: ${CATALOGO_MODO_PRUEBAS:-true}
  CATALOGO_PRECISION_UBICACION: ${CATALOGO_PRECISION_UBICACION:-aproximada}
  # Valoraciones automáticas (clarto.es/inmuebles/valoraciones → panel), server-to-server. Proveedores comerciales apagados (off) por defecto.
  VALORACIONES_API_KEY: ${VALORACIONES_API_KEY:?}
  GHL_FIELD_ESTADO_VALORACION: ${GHL_FIELD_ESTADO_VALORACION:-}
  GHL_FIELD_REFERENCIA_VALORACION: ${GHL_FIELD_REFERENCIA_VALORACION:-}

x-pwb-env: &pwb-env
  RAILS_ENV: staging
  SECRET_KEY_BASE: ${PWB_SECRET_KEY_BASE:?}
  PWB_DATABASE_URL: postgres://pwb:${PWB_DB_PASSWORD:?}@pwb-db:5432/pwb_staging
  ACTIVE_STORAGE_SERVICE: local
  APP_HOST: ${PWB_HOST:?}
  STAGING_APP_HOST: ${PWB_HOST:?}
  PWB_HOST: ${PWB_HOST:?}
  RAILS_SERVE_STATIC_FILES: "true"
  RAILS_LOG_TO_STDOUT: "true"
  SKIP_MIGRATIONS: "true" # migrations run once, explicitly, from scripts/deploy.sh
  RUN_SEEDS: "false"
  REDIS_URL: redis://redis:6379/0
  LIBERU_API_URL: http://liberu-app
  LIBERU_PUBLIC_URL: https://${LIBERU_HOST:?}
  LIBERU_MEDIA_ROOT: /liberu-storage/public
  CATALOG_BRAND: ${CATALOG_BRAND:-CLARTO Inmobiliaria}
  # While the catalog only has fictitious listings every one is labelled with
  # this text; empty it (scripts/catalog-indexing.sh) once real stock is in.
  CATALOG_TEST_LABEL: ${CATALOG_TEST_LABEL-Inmueble de prueba}
  CATALOG_INQUIRY_EMAIL: ${CATALOG_INQUIRY_EMAIL:-buzon-pruebas@clarto.es}
  DEFAULT_FROM_EMAIL: "${CATALOG_BRAND:-CLARTO Inmobiliaria} <${MAIL_FROM_ADDRESS:-no-reply@clarto.es}>"
  SMTP_ADDRESS: mailpit
  SMTP_PORT: "1025"
  SMTP_DOMAIN: ${PWB_HOST:?}
  MAILER_HOST: ${PWB_HOST:?}

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      LIBERU_HOST: ${LIBERU_HOST:?}

      TLS_MODE: ${TLS_MODE:-acme}
      CATALOG_INDEXING: ${CATALOG_INDEXING:-off}
      PREVIEW_HOST: ${PREVIEW_HOST:-inmuebles-previa.clarto.es}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/panel_auth.caddy:/etc/caddy/panel_auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [liberu-app, mailpit]

  # Test mailbox: SMTP sink for both apps (nothing leaves the server).
  # UI at https://<LIBERU_HOST>/buzon/ behind the panel basic auth.
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    environment:
      MP_WEBROOT: buzon
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit_data:/data

  # ---------------------------------------------------------------- Liberu --
  liberu-app:
    build:
      context: ./liberu
      additional_contexts:
        src: ./src/liberu
        brand: ./brand
    image: clarto/liberu:${LIBERU_REF:?}
    restart: unless-stopped
    environment: *liberu-env
    volumes:
      - liberu_storage:/var/www/html/storage/app
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  liberu-worker:
    image: clarto/liberu:${LIBERU_REF:?}
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment: *liberu-env
    volumes:
      - liberu_storage:/var/www/html/storage/app
    depends_on:
      liberu-app: { condition: service_healthy }

  liberu-scheduler:
    image: clarto/liberu:${LIBERU_REF:?}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *liberu-env
    volumes:
      - liberu_storage:/var/www/html/storage/app
    depends_on:
      liberu-app: { condition: service_healthy }

  # WhatsApp HTTP API (WAHA Core, motor GOWS sin navegador). Solo red interna: sin
  # puertos publicados ni ruta en Caddy; la usa liberu-app con X-Api-Key. La sesión
  # vinculada (QR) vive en el volumen waha_sessions: sobrevive a reinicios y redeploys.
  waha:
    image: devlikeapro/waha:gows-2026.10.1@sha256:1f7faeb0227ad5edb5711f7058bfce807ea65e5f92234af0778e4db140f6eb46
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "False"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "false"    # el panel guarda solo texto
      WAHA_API_DOWNLOAD_MEDIA: "false"
      WAHA_GOWS_DEVICE_REQUIRE_FULL_SYNC: "false"   # no sincronizar años de historial
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: info
    volumes:
      - waha_sessions:/app/.sessions

  # ------------------------------------------------------ website preview --
  # CLARTO website branch under review (clarto.es/inmuebles), no password,
  # noindex. Built only when the source was uploaded (scripts/upload-web.sh).
  web-preview:
    profiles: ["preview"]
    build:
      context: ./web
      additional_contexts:
        src: ./src/web
    image: clarto/web-preview:${WEB_REF:-none}
    restart: unless-stopped
    env_file:
      - path: ./src/web/.env   # public Supabase values the site already ships (blog)
        required: false
    environment:
      # Read-only catalog API of the panel, called from the site's server only.
      CATALOGO_API_URL: https://${LIBERU_HOST:?}/api/v1/catalogo
      CATALOGO_API_KEY: ${CATALOGO_API_KEY:?}
      CATALOGO_INDEXABLE: "false"
      # Valoraciones automáticas del panel, llamadas solo desde el servidor de la web.
      VALORACIONES_API_URL: https://${LIBERU_HOST:?}/api/v1/valoraciones
      VALORACIONES_API_KEY: ${VALORACIONES_API_KEY:?}

  # ------------------------------------------------------------------- PWB --
  pwb-web:
    profiles: ["pwb"]  # PropertyWebBuilder paused: catalog lives in clarto.es/inmuebles
    build:
      context: ../..
      dockerfile: deploy/clarto-staging/pwb/Dockerfile
      additional_contexts:
        brand: ./brand
    image: clarto/pwb:${PWB_REF:?}
    restart: unless-stopped
    environment: *pwb-env
    volumes:
      - pwb_storage:/app/storage
    depends_on:
      pwb-db: { condition: service_healthy }
      redis: { condition: service_healthy }

  pwb-worker:
    profiles: ["pwb"]  # PropertyWebBuilder paused: catalog lives in clarto.es/inmuebles
    image: clarto/pwb:${PWB_REF:?}
    restart: unless-stopped
    command: ["bundle", "exec", "bin/jobs"]
    environment: *pwb-env
    volumes:
      - pwb_storage:/app/storage
    depends_on:
      pwb-db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Liberu -> PWB catalog sync, keyed by property reference (idempotent).
  pwb-sync:
    profiles: ["pwb"]  # PropertyWebBuilder paused: catalog lives in clarto.es/inmuebles
    image: clarto/pwb:${PWB_REF:?}
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'while true; do bundle exec rake pwb:liberu:sync; sleep "$${LIBERU_SYNC_INTERVAL:-300}"; done'
    environment:
      <<: *pwb-env
      LIBERU_SYNC_INTERVAL: ${LIBERU_SYNC_INTERVAL:-300}
    volumes:
      - pwb_storage:/app/storage
      - liberu_storage:/liberu-storage:ro
    depends_on:
      pwb-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      liberu-app: { condition: service_healthy }

  # Shared Redis: PWB (db 0-1: cache, Logster, rails_performance, ActionCable)
  # and the panel (db 2-3: cache, so web/worker/scheduler share it).
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  pwb-db:
    profiles: ["pwb"]  # PropertyWebBuilder paused: catalog lives in clarto.es/inmuebles
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pwb_staging
      POSTGRES_USER: pwb
      POSTGRES_PASSWORD: ${PWB_DB_PASSWORD:?}
    volumes:
      - pwb_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwb -d pwb_staging"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  mailpit_data:
  liberu_storage:
  pwb_db:
  redis_data:
  pwb_storage:
  waha_sessions:
